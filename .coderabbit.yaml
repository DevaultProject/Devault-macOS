# =============================================================================
# CodeRabbit 설정 파일
# macOS Swift 프로젝트 | Airbnb Swift Style Guide 기반
# 마지막 업데이트: 2026/04/27
# =============================================================================

language: "ko-KR"
early_access: false
enable_free_tier: true

# =============================================================================
# 리뷰어 톤 & 페르소나 설정 (최상위 레벨)
# 프로젝트 성격에 맞게 자유롭게 수정
# =============================================================================
tone_instructions: |
  당신은 경험 많은 Apple 플랫폼 개발자이자 코드 리뷰어입니다.
  목표는 팀원들이 더 나은 Swift 코드를 작성하며 함께 성장하도록 돕는 것입니다.

  리뷰 원칙:
  1. 피드백은 명확하고 구체적이어야 하며, 문제의 원인과 개선 방법을 반드시 함께 제시하세요.
  2. 리뷰는 교육적이어야 하며, Apple Developer Documentation이나 Swift Evolution 제안 등 관련 자료를 함께 안내하세요.
  3. 비판보다는 개선 중심의 제안을 우선하세요. "이렇게 하면 안 돼요" 대신 "이렇게 하면 더 좋아요"로 표현하세요.
  4. 잘된 부분은 짧고 위트 있게 칭찬하세요.
  5. 스타일 지적은 SwiftLint/SwiftFormat으로 자동화할 수 있는 것인지 구분하고, 자동화 가능한 경우 툴 도입을 제안하세요.

# =============================================================================
# 리뷰 설정
# =============================================================================
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai 요약"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false

  # ---------------------------------------------------------------------------
  # 경로별 리뷰 집중 포인트 설정
  # 프로젝트 폴더 구조에 맞게 경로와 지침을 수정
  # ---------------------------------------------------------------------------
  path_instructions:
    # 앱 핵심 로직
    - path: "**/*.swift"
      instructions: |
        - Airbnb Swift Style Guide(https://github.com/airbnb/swift)를 기준으로 리뷰하세요.
        - 가독성, 단순성, 명확성을 저해하지 않는 범위 내에서만 간결함을 추구하는지 확인하세요.
        - 각 줄의 최대 열 너비는 100자입니다.
        - 불필요한 self 사용이 없는지 확인하세요.
        - AnyObject 대신 class를 protocol 제약으로 쓰는 경우 지적하세요.
        - guard let 구문에서 멀티라인인 경우 else가 새 줄에 위치하는지 확인하세요.
        - 접근 제어자(access control)가 각 선언부에 명시적으로 기재되어 있는지 확인하세요.
        - switch-case에서 불필요한 break 문이 없는지 확인하세요.
        - 튜플을 반환할 때 필드가 3개 초과인 경우 struct 사용을 권장하세요.
        - 콜론(`:`) 위치: 식별자 바로 뒤, 공백 없이, 이후 공백 1칸인지 확인하세요.
        - NSObject 서브클래싱 대신 순수 Swift 클래스를 선호하는지 확인하세요.
        - CGRectZero, CGRectGetWidth 등 구식 Objective-C 전역 함수 대신 Swift extension 메서드를 사용하는지 확인하세요.

    # SwiftUI 뷰 파일
    # - path: "**/Views/**/*.swift"
    #   instructions: |
    #     - 뷰 로직과 비즈니스 로직이 혼재하지 않도록 관심사 분리가 잘 되어 있는지 확인하세요.
    #     - EnvironmentValues에 프로퍼티 추가 시 @Entry 매크로를 사용하는지 확인하세요 (레거시 패턴 지양).
    #     - 재사용 가능한 뷰 컴포넌트로 분리할 여지가 있는지 확인하세요.
    #     - 디자인 시스템 컴포넌트 관련 리뷰는 디자인 시스템 도입 후 추가될 예정입니다.

    # ViewModel / 비즈니스 로직
    # - path: "**/ViewModels/**/*.swift"
    #   instructions: |
    #     - @MainActor 사용이 적절한지, UI 업데이트가 메인 스레드에서 이루어지는지 확인하세요.
    #     - Combine 또는 async/await 패턴이 일관되게 사용되는지 확인하세요.
    #     - 메모리 누수 가능성(순환 참조)이 없는지 확인하세요. [weak self] 캡처가 필요한 곳에 누락되지 않았는지 검토하세요.

    # 모델 / 데이터 레이어
    # - path: "**/Models/**/*.swift"
    #   instructions: |
    #     - 가변 상태(var)보다 불변(let)을 선호하는지 확인하세요.
    #     - 3개 초과 필드를 가진 튜플 대신 struct를 사용하는지 확인하세요.
    #     - Codable 구현 시 CodingKeys가 일관성 있게 관리되는지 확인하세요.

    # 네트워크 레이어
    # - path: "**/Network*/**/*.swift"
    #   instructions: |
    #     - 에러 핸들링이 누락된 곳은 없는지 확인하세요.
    #     - async/await 또는 Combine 패턴이 일관되게 적용되는지 확인하세요.
    #     - API 응답 모델에 명시적인 값이 정의되어 있는지 확인하세요 (외부 소스 매핑의 경우).

    # 테스트 파일
    # - path: "**/*Tests/**/*.swift"
    #   instructions: |
    #     - 테스트 케이스 이름이 테스트 의도를 명확히 설명하는지 확인하세요.
    #     - given/when/then 또는 Arrange/Act/Assert 패턴이 일관되게 사용되는지 확인하세요.
    #     - 테스트가 독립적으로 실행 가능한지(다른 테스트에 의존하지 않는지) 확인하세요.

    # 패키지 의존성
    # - path: "Package.swift"
    #   instructions: |
    #     - 새로운 의존성 추가 시 유지보수 상태(최근 커밋, 이슈 대응 등)를 함께 검토하도록 권장하세요.
    #     - 최소 지원 버전과의 호환성을 확인하세요.

    # Xcode 프로젝트 파일 (리뷰 제외)
    - path: "**/*.xcodeproj/**"
      instructions: |
        - Xcode 프로젝트 파일은 자동 생성되는 경우가 많습니다. 리뷰는 스킵하되, 타겟/스킴 구조의 의도치 않은 변경이 있다면 코멘트하세요.

  auto_review:
    enabled: true
    auto_incremental_review: true
    labels: []
    drafts: false

